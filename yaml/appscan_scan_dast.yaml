image: debian:latest

variables:
  appscanApiKeyId: $APPSCAN_KEY
  appscanApiKeySecret: $APPSCAN_SECRET
  appscanAppName: $APP_NAME
  serviceUrl: 'cloud.appscan.com'
  assetGroupId: $APPSCAN_ASSET
  scanName: $CI_PROJECT_NAME-$CI_JOB_ID
  urlTarget: 'xxxxxxxxxxxxx'
  loginDastConfig: 'login.dast.config'
  manualExplorerDastConfig: 'manualexplorer.dast.config'
  appscanPresenceId: ''
  sevSecGw: 'criticalIssues'
  maxIssuesAllowed: 1000

stages:
- scan-dast

scan-job:
  stage: scan-dast
  script:
    - apt update > /dev/null && apt install curl jq git -y > /dev/null

    - echo -e "\e[42mSCAN VARIABLE SUMMARY - The scans service url is $serviceUrl. The AppScan application name is $appscanAppName and it is part of asset group id number $assetGroupId. The url target is $urlTarget. The scan name will be $CI_PROJECT_NAME-$CI_JOB_ID. The AppScan Presence id is $appscanPresenceId <-(in case it is empty the application must be public). The Security Gate permit less than $maxIssuesAllowed $sevSecGw severity.\e[0m"

    - curl -k -s -O https://raw.githubusercontent.com/HCL-TECH-SOFTWARE/appscan-gitlab-integration/V2/scripts/appscan_create_application_asoc.sh
    - chmod +x appscan_create_application_asoc.sh
    - ./appscan_create_application_asoc.sh

    - curl -k -s -O https://raw.githubusercontent.com/HCL-TECH-SOFTWARE/appscan-gitlab-integration/V2/scripts/appscan_dast_scan.sh
    - chmod +x appscan_dast_scan.sh
    - ./appscan_dast_scan.sh

    - curl -k -s -O https://raw.githubusercontent.com/HCL-TECH-SOFTWARE/appscan-gitlab-integration/V2/scripts/appscan_get_html_report.sh
    - chmod +x appscan_get_html_report.sh
    - ./appscan_get_html_report.sh

    - curl -k -s -O https://raw.githubusercontent.com/HCL-TECH-SOFTWARE/appscan-gitlab-integration/V2/scripts/appscan_get_xml_report.sh
    - chmod +x appscan_get_xml_report.sh
    - ./appscan_get_xml_report.sh

    - curl -k -s -O https://raw.githubusercontent.com/HCL-TECH-SOFTWARE/appscan-gitlab-integration/V2/scripts/appscan_check_security_gate.sh
    - chmod +x appscan_check_security_gate.sh
    - ./appscan_check_security_gate.sh

  artifacts:
    when: always
    paths:
      - "*.html"
