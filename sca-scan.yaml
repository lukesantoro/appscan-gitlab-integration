variables:
  appscanApiKeyId: $APPSCAN_KEY
  appscanApiKeySecret: $APPSCAN_SECRET
  appscanAppName: $APP_ID
  serviceUrl: 'cloud.appscan.com'
  assetGroupId: 'xxxxxxxxxxxxxx'
  scanName: $APP_ID-$CI_JOB_ID
  considerPkgManager: 'yes' #to ignore pkg manager files change to 'no'
  sevSecGw: 'criticalIssues'
  maxIssuesAllowed: 100

include:
  - remote: 'https://github.com/HCL-TECH-SOFTWARE/appscan-gitlab-integration/V2/yaml/appscanasoc_scan_sca.yaml'

stages:
- scan-sca

scan-job:
  stage: scan-sca
